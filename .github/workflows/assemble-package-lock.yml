name: assemble-package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - ".ggt-lock-parts/**"
      - ".github/workflows/assemble-package-lock.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-to-pdf-scaffold
      - name: Assemble package-lock.json
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          parts = sorted(pathlib.Path(".ggt-lock-parts").glob("lock.b64gz.*"))
          assert parts, "missing lock parts"
          b64 = "".join(p.read_text() for p in parts)
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("package-lock.json").write_bytes(raw)
          print("wrote", len(raw), "bytes")
          assert len(raw) == 87665, len(raw)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: assemble package-lock.json for npm ci"
          git push origin HEAD:feat/chat-to-pdf-scaffold
